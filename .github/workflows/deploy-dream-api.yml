name: Deploy dream-api (production)
# Solo se publica al empujar a la rama deploy/dream-api. Antes pasan las mismas
# comprobaciones del servidor que en «Dream checks». El token vive en el secreto
# del repositorio SUPABASE_ACCESS_TOKEN; nunca en el código.
on:
  push:
    branches: [deploy/dream-api]
permissions:
  contents: read
concurrency:
  group: deploy-dream-api
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npx --yes deno@2.9.6 check --config supabase/functions/dream-api/deno.json supabase/functions/dream-api/index.ts
      - run: npx --yes deno@2.9.6 test --config supabase/functions/dream-api/deno.json --allow-read --allow-env --allow-net=127.0.0.1 supabase/tests/security_deno.mjs supabase/tests/uploads_deno.mjs supabase/tests/exam_wizard_deno.mjs
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Falta el secreto SUPABASE_ACCESS_TOKEN"; exit 1; }
          npx --yes supabase@2.120.0 functions deploy dream-api --project-ref cxaujyagtpsxvkwkdxbc --use-api
