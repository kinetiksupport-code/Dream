<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text","SF Pro Display","Inter",system-ui,sans-serif;color:#080B14;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
a{color:inherit;text-decoration:none}
button,input,textarea{font-family:inherit}
.press{transition:transform 160ms cubic-bezier(.23,1,.32,1),background-color 160ms ease-out,color 160ms ease-out}
.press:active{transform:scale(.97)}
.rise{animation:rise 280ms cubic-bezier(.23,1,.32,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
:focus-visible{outline:2px solid #155BFF;outline-offset:2px}
@media (hover:hover) and (pointer:fine){.nav:hover{background:rgba(8,11,20,.05)}.chip:hover{background:#EAEEF5}.send:hover{background:#246BFD}.ghost:hover{background:#EDF1F8}}
@media (prefers-reduced-motion:reduce){.press{transition:none}.press:active{transform:none}.rise{animation-name:fade}@keyframes fade{from{opacity:0}to{opacity:1}}}
</style>
</helmet>
<div style="display:flex;flex-wrap:wrap;min-height:960px;background:#FFFFFF">
  <nav aria-label="Principal" style="flex:0 0 264px;box-sizing:border-box;min-height:960px;display:flex;flex-direction:column;gap:24px;padding:24px 16px;background:#F5F7FA">

    </div>

        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>

      <a class="nav press" href="#" style="display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;color:#080B14;font-size:15px;font-weight:500">

  <main style="flex:999 1 560px;min-width:0;box-sizing:border-box;min-height:960px;padding:48px;display:flex;flex-direction:column;align-items:center;justify-content:center">
    <div style="width:100%;max-width:720px;display:flex;flex-direction:column;gap:32px">
      <h1 class="rise" style="margin:0;font-size:44px;line-height:1.1;font-weight:700;letter-spacing:-0.025em;text-wrap:balance">¿Qué quieres entender hoy?</h1>

      <form class="rise" style="animation-delay:50ms;display:flex;flex-direction:column;gap:8px;padding:20px;border:1px solid #E4E8EF;border-radius:24px;background:#FFFFFF;box-shadow:0 1px 2px rgba(8,11,20,.04),0 8px 24px rgba(8,11,20,.05)">
        <label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Pregunta a Dream</label>
        <textarea id="q" rows="2" placeholder="Haz una pregunta o pega un ejercicio" style="border:0;outline:0;resize:none;font-size:18px;line-height:1.5;color:#080B14;background:transparent;padding:4px 4px 0"></textarea>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
          <button class="ghost press" type="button" aria-label="Adjuntar archivo" style="width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#5B6678;display:flex;align-items:center;justify-content:center;cursor:pointer">

          <button class="send press" type="submit" aria-label="Enviar" style="width:44px;height:44px;border:0;border-radius:50%;background:#155BFF;color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </form>

      <div class="rise" style="animation-delay:100ms;display:flex;flex-wrap:wrap;gap:8px">
        <a class="chip press" href="#" style="display:flex;align-items:center;height:44px;padding:0 20px;border-radius:22px;background:#F5F7FA;font-size:15px;font-weight:500">Subir apuntes</a>
        <a class="chip press" href="#" style="display:flex;align-items:center;height:44px;padding:0 20px;border-radius:22px;background:#F5F7FA;font-size:15px;font-weight:500">Practicar ejercicios</a>
        <a class="chip press" href="#" style="display:flex;align-items:center;height:44px;padding:0 20px;border-radius:22px;background:#F5F7FA;font-size:15px;font-weight:500">Hacer un test</a>
