<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Dream – Test móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text","SF Pro Display","Inter",system-ui,sans-serif;color:#080B14;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
a{color:inherit;text-decoration:none}
input{font-family:inherit}
.press{transition:transform 160ms cubic-bezier(.23,1,.32,1),background-color 160ms ease-out,color 160ms ease-out}
.press:active{transform:scale(.97)}
.rise{animation:rise 220ms cubic-bezier(.23,1,.32,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
:focus-visible{outline:2px solid #155BFF;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.press{transition:none}.press:active{transform:none}.rise{animation-name:fade}@keyframes fade{from{opacity:0}to{opacity:1}}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#FFFFFF">
  <main style="box-sizing:border-box;height:100%;padding:56px 20px 112px;display:flex;flex-direction:column;gap:20px;overflow:hidden">
    <header style="display:flex;align-items:center;gap:12px">
      <a class="press" href="MovilExamenes.dc.html" style="flex:0 0 auto;display:flex;align-items:center;height:44px;margin-left:-8px;padding:0 8px;color:#155BFF;font-size:17px">Salir</a>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px">
        <p style="margin:0;font-size:13px;color:#5B6678;text-align:center">Pregunta 2 de 5</p>
        <progress value="2" max="5" aria-label="Progreso del test" style="width:100%;height:6px;accent-color:#155BFF"></progress>
      </div>
      <span style="flex:0 0 48px" aria-hidden="true"></span>
    </header>

    <form style="margin:0">
      <fieldset style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:20px">
        <legend style="padding:0;margin:0 0 20px;font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-0.02em;text-wrap:balance">¿Qué dos números suman 5 y multiplicados dan 6?</legend>
        <div style="display:flex;flex-direction:column;gap:8px">
          <label for="o1" style="display:flex;align-items:center;gap:14px;min-height:52px;padding:0 16px;border:1px solid #E4E8EF;border-radius:14px;font-size:17px"><input id="o1" type="radio" name="q" disabled style="width:20px;height:20px;margin:0;accent-color:#155BFF">1 y 5</label>
          <label for="o2" style="display:flex;align-items:center;gap:14px;min-height:52px;padding:0 15px;border:2px solid #155BFF;border-radius:14px;font-size:17px;font-weight:600;background:rgba(21,91,255,.06)"><input id="o2" type="radio" name="q" checked style="width:20px;height:20px;margin:0;accent-color:#155BFF">2 y 3</label>
          <label for="o3" style="display:flex;align-items:center;gap:14px;min-height:52px;padding:0 16px;border:1px solid #E4E8EF;border-radius:14px;font-size:17px"><input id="o3" type="radio" name="q" disabled style="width:20px;height:20px;margin:0;accent-color:#155BFF">1 y 6</label>
          <label for="o4" style="display:flex;align-items:center;gap:14px;min-height:52px;padding:0 16px;border:1px solid #E4E8EF;border-radius:14px;font-size:17px"><input id="o4" type="radio" name="q" disabled style="width:20px;height:20px;margin:0;accent-color:#155BFF">3 y 4</label>
        </div>
      </fieldset>
    </form>

    <section class="rise" role="status" style="display:flex;flex-direction:column;gap:8px;padding:16px 18px;border-radius:18px;background:#EAF6EE">
      <p style="margin:0;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;color:#17692F">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Correcto</p>
      <p style="margin:0;font-size:15px;line-height:1.45">Como 2 + 3 = 5 y 2 · 3 = 6, se factoriza como (x − 2)(x − 3) = 0. Soluciones: x = 2 y x = 3.</p>
    </section>
  </main>

  <div style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:12px 20px 34px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)">
    <a class="press" href="MovilTest.dc.html" style="display:flex;align-items:center;justify-content:center;height:48px;border-radius:24px;background:#155BFF;color:#FFFFFF;font-size:17px;font-weight:600">Siguiente</a>
  </div>
</div>
</x-dc>
