<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Dream – Test</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text","SF Pro Display","Inter",system-ui,sans-serif;color:#080B14;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit}
.press{transition:transform 160ms cubic-bezier(.23,1,.32,1),background-color 160ms ease-out,color 160ms ease-out}
.press:active{transform:scale(.97)}
.rise{animation:rise 220ms cubic-bezier(.23,1,.32,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
:focus-visible{outline:2px solid #155BFF;outline-offset:2px}
@media (hover:hover) and (pointer:fine){.ghost:hover{background:#EDF1F8}.primary:hover{background:#246BFD}.opt:hover{background:#F5F7FA}}
@media (prefers-reduced-motion:reduce){.press{transition:none}.press:active{transform:none}.rise{animation-name:fade}@keyframes fade{from{opacity:0}to{opacity:1}}}
</style>
</helmet>
<div style="min-height:960px;box-sizing:border-box;background:#FFFFFF;display:flex;flex-direction:column">
  <header style="display:flex;align-items:center;gap:24px;padding:20px 32px">
    <a class="ghost press" href="Examenes.dc.html" style="flex:0 0 auto;display:flex;align-items:center;height:44px;padding:0 16px;margin-left:-16px;border-radius:12px;color:#155BFF;font-size:15px;font-weight:600">Salir</a>
    <div style="flex:1;display:flex;flex-direction:column;gap:8px;max-width:640px;margin:0 auto">
      <p style="margin:0;font-size:14px;color:#5B6678;text-align:center">Pregunta 2 de 5</p>
      <progress value="2" max="5" aria-label="Progreso del test" style="width:100%;height:6px;accent-color:#155BFF"></progress>
    </div>
    <span style="flex:0 0 64px" aria-hidden="true"></span>
  </header>

  <main style="flex:1;box-sizing:border-box;padding:48px 32px 64px;display:flex;justify-content:center">
    <div style="width:100%;max-width:640px;display:flex;flex-direction:column;gap:32px">
      <form style="display:flex;flex-direction:column;gap:24px;border:0;padding:0;margin:0">
        <fieldset style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:24px">
          <legend style="padding:0;margin:0 0 24px;font-size:28px;line-height:1.25;font-weight:700;letter-spacing:-0.02em;text-wrap:balance">¿Qué dos números suman 5 y multiplicados dan 6?</legend>
          <div style="display:flex;flex-direction:column;gap:8px">
            <label class="opt press" for="o1" style="display:flex;align-items:center;gap:16px;min-height:56px;padding:0 20px;border:1px solid #E4E8EF;border-radius:16px;font-size:17px;cursor:pointer"><input id="o1" type="radio" name="q" disabled style="width:20px;height:20px;margin:0;accent-color:#155BFF">1 y 5</label>
            <label class="opt press" for="o2" style="display:flex;align-items:center;gap:16px;min-height:56px;padding:0 20px;border:2px solid #155BFF;border-radius:16px;font-size:17px;font-weight:600;background:rgba(21,91,255,.06);cursor:pointer"><input id="o2" type="radio" name="q" checked style="width:20px;height:20px;margin:0;accent-color:#155BFF">2 y 3</label>
            <label class="opt press" for="o3" style="display:flex;align-items:center;gap:16px;min-height:56px;padding:0 20px;border:1px solid #E4E8EF;border-radius:16px;font-size:17px;cursor:pointer"><input id="o3" type="radio" name="q" disabled style="width:20px;height:20px;margin:0;accent-color:#155BFF">1 y 6</label>
            <label class="opt press" for="o4" style="display:flex;align-items:center;gap:16px;min-height:56px;padding:0 20px;border:1px solid #E4E8EF;border-radius:16px;font-size:17px;cursor:pointer"><input id="o4" type="radio" name="q" disabled style="width:20px;height:20px;margin:0;accent-color:#155BFF">3 y 4</label>
          </div>
        </fieldset>
      </form>

      <section class="rise" role="status" style="display:flex;flex-direction:column;gap:12px;padding:20px 24px;border-radius:20px;background:#EAF6EE">
        <p style="margin:0;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;color:#17692F">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Correcto</p>
        <p style="margin:0;font-size:17px;line-height:1.5;color:#080B14;max-width:52ch">Como 2 + 3 = 5 y 2 · 3 = 6, la ecuación se factoriza como (x − 2)(x − 3) = 0. Las soluciones son x = 2 y x = 3.</p>
      </section>

      <div style="display:flex;justify-content:flex-end">
        <a class="primary press" href="Test.dc.html" style="display:flex;align-items:center;height:48px;padding:0 28px;border-radius:24px;background:#155BFF;color:#FFFFFF;font-size:17px;font-weight:600">Siguiente</a>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
